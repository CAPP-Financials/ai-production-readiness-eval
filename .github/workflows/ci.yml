name: suite-integrity
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Lint (one owner per metric, single source of thresholds)
        run: python tools/aggregate.py lint
      - name: Self-test (scoring and verdict rules)
        run: python tools/aggregate.py selftest
      - name: Example report reproduces
        run: |
          python tools/aggregate.py report examples/acme-help-assistant/profile.json examples/acme-help-assistant/results /tmp/report.md
          diff --strip-trailing-cr /tmp/report.md examples/acme-help-assistant/report.md
